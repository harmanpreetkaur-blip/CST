<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readers' Haven - Book Registration &Order Form </title>
</head>
<body style=" 
       background-image: url('assign13.jpg');
       background-repeat: no-repeat;
       background-size: cover;
">

    <h2> Readers' Haven - Book Registration & Order Form</h2>

    <p>
        Welcome to Readers' Haven! Fill in the form below
        to register and place your book order.
    </p>

    <form action="Readers' haven.html"  target="_blank">
        
        <label for="name">Customer Name:</label>
        <input type="text" id="name" name="customerName"
               placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email address" required>
        <br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile"
               placeholder="Enter your mobile number" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"
               placeholder="Enter your age" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Create your password" required>
        <br><br>

        <label for="deliveryDate">Delivery Date:</label>
        <input type="date" id="deliveryDate" name="deliveryDate">
        <br><br>

        <label for="deliveryTime">Preferred Delivery Time:</label>
        <input type="time" id="deliveryTime" name="deliveryTime">
        <br><br>

        <label for="category">Favorite Book Category:</label>

        <select id="category" name="bookCategory" required>
            <option value=""> Select Category </option>
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
            <option value="Children's Books">Children's Books</option>
        </select>

        <br><br>

        <label for="bookTitle">Book Title:</label>
        <input type="text" id="bookTitle" name="bookTitle"
               placeholder="Enter book title" required>
        <br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity"
               min="1" value="1" required>
        <br><br>

        <p>Preferred Payment Method:</p>

        <input type="radio" id="cod" name="payment"
               value="Cash on Delivery" required>
        <label for="cod">Cash on Delivery</label>

        <input type="radio" id="online" name="payment"
               value="Online Payment">
        <label for="online">Online Payment</label>

        <br><br>

        <p>Additional Services:</p>

        <input type="checkbox" id="gift" name="services"
               value="Gift Wrapping">
        <label for="gift">Gift Wrapping</label>
        <br>

        <input type="checkbox" id="bookmark" name="services"
               value="Bookmark">
        <label for="bookmark">Bookmark</label>
        <br>

        <input type="checkbox" id="express" name="services"
               value="Express Delivery">
        <label for="express">Express Delivery</label>
        <br>

        <input type="checkbox" id="card" name="services"
               value="Greeting Card">
        <label for="card">Greeting Card</label>

        <br><br>

        <input type="hidden" name="formName"
               value="Readers Haven Book Order">

        <label for="file">Upload Reference Image/Document:</label>
        <input type="file" id="file" name="referenceFile"
               accept="image/*,.pdf,.doc,.docx">

        <br><br>

        <label for="address">Delivery Address:</label>
        <br>
        <textarea id="address" name="address" rows="4" cols="40"
                  placeholder="Enter your complete delivery address"required></textarea>

        <br><br>

        <label for="instructions">Special Instructions:</label>
        <br>
        <textarea id="instructions" name="instructions"
                  rows="4" cols="40" placeholder="Enter any special instructions" required ></textarea>

        <br><br>

        <button type="submit">Submit Order</button>
        <button type="reset">Reset Form</button>

    </form>
</body>
</html>
