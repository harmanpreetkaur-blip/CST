<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Explorer</title>
</head>
<body>
    <h1>WORLD MAP EXPLORER</h1>
    <img src="https://www.mapsofworld.com/maps/world-map.jpg" 
         alt="world map" usemap="#worldmap"      
        width="1250">

    <map name="worldmap">

    <area shape="rect"
          coords="1350,704,1371,878"
          href="https://en.wikipedia.org/wiki/India"
          alt=" India "
          target="_blank" >
   
    <area shape="circle"
          coords="1512,719,93"
          href="https://www.britannica.com/place/China"
          alt=" China "
          target="_blank"> 

    <area shape="poly"
          coords="1080,813,1139,794,1154,824,1132,864,1075,869,1075,838"
          href="https://en.wikipedia.org/wiki/Sudan"
          alt="Sudan"
          target="_blank">

    <area shape="default"
          href="https://en.wikipedia.org/wiki/World"
          alt=" World "
          target="_blank">  
    </map> </body>
</html>
